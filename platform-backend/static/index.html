<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KI-Plattform · Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#07080d; --bg-soft:#0a0c13;
    --panel:#12151f; --panel-2:#171b28; --border:#242a3d; --border-soft:#1a1f2e;
    --text:#eef0f7; --muted:#8b93ab; --muted-dim:#5a6178;
    --accent:#7c8bfa; --accent-dim:#4c56b0; --accent-ink:#fff;
    --signal:#3fe3c4;
    --ok:#34d399; --warn:#f5b955; --danger:#ff7a7a;
    --radius-lg:16px; --radius-md:12px; --radius-sm:9px;
    --ease-out:cubic-bezier(0.16,1,0.3,1);
  }
  * { box-sizing:border-box; }
  html { color-scheme: dark; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
    background-image:
      radial-gradient(680px 420px at 12% -8%, rgba(124,139,250,0.10), transparent 60%),
      radial-gradient(600px 380px at 100% 0%, rgba(63,227,196,0.06), transparent 55%);
    background-repeat:no-repeat;
  }
  .brand-font { font-family:"Space Grotesk", -apple-system, sans-serif; }

  header {
    display:flex; align-items:center; gap:14px; padding:14px 22px;
    border-bottom:1px solid var(--border-soft); background:rgba(10,12,19,0.75);
    backdrop-filter:blur(10px); position:sticky; top:0; z-index:10;
  }
  .brandmark {
    width:22px; height:22px; border-radius:7px; flex-shrink:0;
    background:linear-gradient(135deg, var(--accent), var(--signal));
  }
  header h1 { font-size:15px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  header .spacer { flex:1; }

  select, input, button, textarea {
    font:inherit; color:var(--text); background:var(--panel-2);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 12px; outline:none; transition:border-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
  }
  select:focus-visible, input:focus-visible, textarea:focus-visible {
    border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,139,250,0.22);
  }
  button {
    background:var(--accent); border-color:var(--accent); color:#0b0d16;
    cursor:pointer; font-weight:600; letter-spacing:-0.005em;
    transition:transform 120ms var(--ease-out), background 160ms var(--ease-out), opacity 160ms;
  }
  button:hover:not(:disabled) { background:#909dfb; border-color:#909dfb; }
  button:active:not(:disabled) { transform:scale(0.97); }
  button:disabled { opacity:0.5; cursor:default; }
  button.ghost {
    background:transparent; color:var(--text); border-color:var(--border); font-weight:500;
  }
  button.ghost:hover:not(:disabled) { background:var(--panel-2); border-color:var(--border); }

  .usage { font-size:12.5px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }

  main { max-width:820px; margin:0 auto; padding:22px 20px 0; }

  /* Willkommen / Login */
  .setup-wrap { min-height:62vh; display:flex; align-items:center; justify-content:center; }
  .setup {
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:32px; width:100%; max-width:420px;
    box-shadow:0 24px 60px -32px rgba(0,0,0,0.6);
  }
  .setup h2 { margin:0 0 6px; font-size:20px; letter-spacing:-0.01em; }
  .setup > p.lead { color:var(--muted); font-size:13.5px; margin:0 0 22px; }
  .setup label { display:block; font-size:12.5px; color:var(--muted); margin:0 0 6px; font-weight:500; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .hint { color:var(--muted-dim); font-size:12px; margin:12px 0 0; line-height:1.5; }
  .err { color:var(--danger); font-size:13px; min-height:18px; margin-top:8px; }

  /* Chat */
  #log { display:flex; flex-direction:column; gap:14px; min-height:52vh; padding:6px 0 20px; }
  .msg {
    padding:12px 15px; border-radius:var(--radius-md); max-width:80%;
    white-space:pre-wrap; word-wrap:break-word; font-size:14.5px;
    animation:msg-in 260ms var(--ease-out) both;
  }
  @keyframes msg-in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .msg.user {
    align-self:flex-end; color:#0b0d16; font-weight:500;
    background:linear-gradient(155deg, var(--accent), #9aa5fb);
  }
  .msg.assistant { align-self:flex-start; background:var(--panel-2); border:1px solid var(--border-soft); }
  .msg .meta { display:block; font-size:11px; opacity:0.7; margin-top:7px; font-variant-numeric:tabular-nums; }
  .msg.user .meta { color:#0b0d16; }
  .msg.assistant .meta { color:var(--muted); }

  .typing { display:flex; gap:4px; align-self:flex-start; padding:14px 15px; }
  .typing span {
    width:6px; height:6px; border-radius:50%; background:var(--signal);
    animation:typing-bounce 1.1s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay:0.15s; }
  .typing span:nth-child(3) { animation-delay:0.3s; }
  @keyframes typing-bounce { 0%,60%,100% { opacity:0.3; transform:translateY(0); } 30% { opacity:1; transform:translateY(-3px); } }

  .composer {
    position:sticky; bottom:0; background:linear-gradient(var(--bg) 55%, var(--bg));
    padding:14px 0 18px; display:flex; gap:10px; align-items:flex-end;
  }
  .composer textarea { flex:1; resize:vertical; min-height:52px; max-height:200px; }
  .composer button { padding:0 20px; align-self:stretch; border-radius:var(--radius-sm); }

  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--panel-2);
    padding:1px 5px; border-radius:5px; font-size:0.9em; }

  @media (prefers-reduced-motion: reduce) {
    .msg { animation:none; }
    .typing span { animation:none; opacity:0.6; }
    button, select, input, textarea { transition:none; }
  }
</style>
</head>
<body>
<header>
  <div class="brandmark"></div>
  <h1 class="brand-font">KI-Plattform</h1>
  <div class="spacer"></div>
  <select id="model" title="Modell wählen"></select>
  <span class="usage" id="usage">–</span>
  <a class="ghost" href="/dashboard.html"
     style="text-decoration:none;padding:9px 13px;border-radius:9px;border:1px solid var(--border);font-size:14px;"
     title="Zum Dashboard">Dashboard →</a>
  <button class="ghost" id="logout" title="API-Key vergessen" style="padding:9px 12px;">⎋</button>
</header>

<main>
  <div class="setup-wrap" id="setupWrap">
    <div class="setup" id="setup">
      <h2 class="brand-font">Willkommen zurück</h2>
      <p class="lead">Mit deinem API-Schlüssel anmelden, um loszulegen.</p>
      <label for="key">API-Schlüssel (aus <code>/admin/provision</code>)</label>
      <div class="row">
        <input id="key" type="password" placeholder="pk_…" style="flex:1;min-width:0" />
        <button id="connect">Verbinden</button>
      </div>
      <p class="hint">Der Schlüssel bleibt nur lokal im Browser (localStorage). Das Modell wird pro Tarif freigeschaltet.</p>
      <div class="err" id="setupErr"></div>
    </div>
  </div>

  <div id="chat" style="display:none">
    <div id="log"></div>
    <div class="composer">
      <textarea id="input" placeholder="Nachricht… (Enter sendet, Shift+Enter = Zeile)"></textarea>
      <button id="send">Senden</button>
    </div>
    <div class="err" id="chatErr"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let KEY = localStorage.getItem("pk") || "";
let convId = null;
let history = [];

function authHeader() { return { "Authorization": "Bearer " + KEY, "Content-Type": "application/json" }; }

async function loadModels() {
  const r = await fetch("/v1/models", { headers: authHeader() });
  if (!r.ok) throw new Error((await r.json()).detail || ("HTTP " + r.status));
  const data = await r.json();
  const sel = $("model");
  sel.innerHTML = "";
  for (const m of data.models) {
    const o = document.createElement("option");
    o.value = m.id; o.textContent = m.label + (m.local ? "" : "");
    sel.appendChild(o);
  }
  if (!data.models.length) throw new Error("Keine Modelle im Tarif freigeschaltet");
}

async function refreshUsage() {
  try {
    const r = await fetch("/v1/billing", { headers: authHeader() });
    if (!r.ok) return;
    const b = await r.json();
    const pct = b.usage.percent;
    $("usage").textContent = `${b.plan} · ${b.usage.tokens_total}/${b.usage.limit} Tokens (${pct}%)`;
    // Abo-Zustand sichtbar machen, wenn er Aufmerksamkeit braucht.
    const warn = b.account_status !== "active" || (b.subscription_status && b.subscription_status !== "active");
    $("usage").style.color = warn ? "var(--danger)" : (pct >= 90 ? "var(--warn)" : "var(--muted)");
    if (warn) $("usage").title = `Konto: ${b.account_status} · Abo: ${b.subscription_status || "—"}`;
  } catch {}
}

function addMsg(role, content, meta) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = content;
  if (meta) { const s = document.createElement("span"); s.className = "meta"; s.textContent = meta; el.appendChild(s); }
  $("log").appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "end" });
  return el;
}

function showTyping() {
  const el = document.createElement("div");
  el.className = "typing";
  el.id = "typingIndicator";
  el.innerHTML = "<span></span><span></span><span></span>";
  $("log").appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "end" });
}
function hideTyping() { $("typingIndicator")?.remove(); }

async function connect() {
  $("setupErr").textContent = "";
  KEY = $("key").value.trim();
  if (!KEY) { $("setupErr").textContent = "Bitte einen Schlüssel eingeben."; return; }
  try {
    await loadModels();
    localStorage.setItem("pk", KEY);
    $("setupWrap").style.display = "none";
    $("chat").style.display = "block";
    refreshUsage();
  } catch (e) {
    $("setupErr").textContent = "Verbindung fehlgeschlagen: " + e.message;
  }
}

// Liest den SSE-Stream von /v1/chat (stream:true) und schreibt Text live in
// die Antwort-Blase -- die Antwort erscheint Wort fuer Wort statt nach
// einer vollen Wartezeit auf einmal.
async function send() {
  const text = $("input").value.trim();
  if (!text) return;
  $("chatErr").textContent = "";
  $("input").value = "";
  addMsg("user", text);
  history.push({ role: "user", content: text });
  const model = $("model").value;
  $("send").disabled = true;
  showTyping();

  let assistantEl = null;
  let full = "";
  let tokensIn = 0, tokensOut = 0;

  try {
    const r = await fetch("/v1/chat", {
      method: "POST", headers: authHeader(),
      body: JSON.stringify({ model, messages: history, conversation_id: convId, stream: true }),
    });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      throw new Error(data.detail || ("HTTP " + r.status));
    }

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const chunk = line.slice(5).trim();
        if (chunk === "[DONE]") continue;
        let obj;
        try { obj = JSON.parse(chunk); } catch { continue; }
        const piece = obj.choices?.[0]?.delta?.content;
        if (piece) {
          if (!assistantEl) { hideTyping(); assistantEl = addMsg("assistant", ""); }
          full += piece;
          assistantEl.firstChild ? (assistantEl.firstChild.textContent = full) : (assistantEl.textContent = full);
          assistantEl.scrollIntoView({ behavior: "smooth", block: "end" });
        }
        if (obj.usage) { tokensIn = obj.usage.prompt_tokens || 0; tokensOut = obj.usage.completion_tokens || 0; }
      }
    }

    hideTyping();
    if (!assistantEl) assistantEl = addMsg("assistant", full || "(keine Antwort)");
    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = `${model} · ${tokensIn}→${tokensOut} Tokens`;
    assistantEl.appendChild(meta);

    history.push({ role: "assistant", content: full });
    refreshUsage();
  } catch (e) {
    hideTyping();
    $("chatErr").textContent = "Fehler: " + e.message;
  } finally {
    $("send").disabled = false;
  }
}

$("connect").onclick = connect;
$("send").onclick = send;
$("logout").onclick = () => { localStorage.removeItem("pk"); location.reload(); };
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

// Auto-Connect, wenn ein Schlüssel gespeichert ist.
if (KEY) { $("key").value = KEY; connect(); }
</script>
</body>
</html>
