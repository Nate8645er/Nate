<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KI-Plattform · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#07080d; --panel:#12151f; --panel2:#171b28; --border:#242a3d; --border-soft:#1a1f2e;
    --text:#eef0f7; --muted:#8b93ab; --accent:#7c8bfa; --accent2:#4c56b0; --signal:#3fe3c4;
    --ok:#34d399; --danger:#ff7a7a; --warn:#f5b955;
    --radius-lg:16px; --radius-md:12px; --radius-sm:9px;
    --ease-out:cubic-bezier(0.16,1,0.3,1);
  }
  * { box-sizing:border-box; }
  html { color-scheme: dark; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
    background-image: radial-gradient(680px 420px at 12% -8%, rgba(124,139,250,0.09), transparent 60%);
    background-repeat:no-repeat; }
  .brand-font { font-family:"Space Grotesk", -apple-system, sans-serif; }
  .brandmark { width:20px; height:20px; border-radius:6px; flex-shrink:0;
    background:linear-gradient(135deg, var(--accent), var(--signal)); }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:14px 22px;
    border-bottom:1px solid var(--border-soft); background:rgba(10,12,19,0.75);
    backdrop-filter:blur(10px); position:sticky; top:0; z-index:10; }
  header h1 { font-size:15px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  header .spacer { flex:1; }
  @media (max-width: 640px) {
    header { padding:12px 16px; }
    header h1 { display:none; }
    header .spacer { flex-basis:100%; height:0; }
  }
  header a.navlink { color:var(--muted); text-decoration:none; font-size:13.5px;
    border:1px solid var(--border); border-radius:9px; padding:8px 13px;
    transition:border-color 160ms var(--ease-out), color 160ms; }
  header a.navlink:hover { color:var(--text); border-color:var(--accent); }
  select, input, button, textarea { font:inherit; color:var(--text);
    background:var(--panel2); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 11px; outline:none; transition:border-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out), transform 120ms var(--ease-out); }
  select:focus-visible, input:focus-visible, textarea:focus-visible {
    border-color:var(--accent); box-shadow:0 0 0 3px rgba(124,139,250,0.22); }
  button { background:var(--accent); border-color:var(--accent); color:#0b0d16; cursor:pointer;
    font-weight:600; letter-spacing:-0.005em; }
  button:hover:not(:disabled) { background:#909dfb; border-color:#909dfb; }
  button:active:not(:disabled) { transform:scale(0.97); }
  button:disabled { opacity:.5; cursor:not-allowed; background:var(--panel2); border-color:var(--border); color:var(--muted); }
  button.ghost { background:transparent; border-color:var(--border); font-weight:500; color:var(--text); }
  button.ghost:hover:not(:disabled) { background:var(--panel2); }
  button.danger-btn { background:transparent; border-color:var(--border); color:var(--danger);
    font-weight:600; padding:5px 9px; font-size:13px; }
  button.danger-btn:hover { background:var(--danger); border-color:var(--danger); color:#1a0a0a; }
  button.danger-btn.confirm { background:var(--danger); border-color:var(--danger); color:#1a0a0a; }
  main { max-width:1180px; margin:0 auto; padding:24px 20px; }
  .hint { color:var(--muted); font-size:12.5px; }
  .err { color:var(--danger); font-size:13px; min-height:18px; margin-top:6px; }
  .setup { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:24px; margin-bottom:16px; max-width:480px;
    box-shadow:0 24px 60px -32px rgba(0,0,0,0.6); }
  .setup label { display:block; font-size:12.5px; color:var(--muted); margin:0 0 6px; font-weight:500; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap:16px; align-items:start; }
  .widget { background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg);
    padding:0; overflow:hidden; transition:border-color .15s, opacity .15s, transform .15s var(--ease-out);
    animation:widget-in 320ms var(--ease-out) both; }
  @keyframes widget-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .widget.drag-over { border-color:var(--accent); }
  .widget.dragging { opacity:.45; }
  .widget-head { display:flex; align-items:center; gap:10px; padding:13px 16px;
    border-bottom:1px solid var(--border-soft); cursor:grab; }
  .widget-head:active { cursor:grabbing; }
  .widget-head .handle { color:var(--muted); font-size:14px; letter-spacing:1px; user-select:none; }
  .widget-head h2 { font-size:14px; font-weight:600; margin:0; flex:1; letter-spacing:-0.005em; }
  .widget-head .badge { font-size:11.5px; color:var(--muted); background:var(--bg);
    border:1px solid var(--border); border-radius:999px; padding:3px 9px; }
  .widget-body { padding:16px; }
  .widget-body .loading { color:var(--muted); font-size:13px; }
  .empty { color:var(--muted); font-size:13px; padding:8px 0; }

  .agent-item { padding:9px 0; border-bottom:1px solid var(--border-soft); }
  .agent-item:last-child { border-bottom:none; }
  .agent-row { display:flex; align-items:center; gap:10px; }
  .agent-row .info { flex:1; min-width:0; }
  .agent-row .name { font-weight:600; font-size:13.5px; }
  .agent-row .model { color:var(--muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .agent-form { margin-top:14px; padding-top:14px; border-top:1px solid var(--border-soft);
    display:flex; flex-direction:column; gap:9px; }
  .agent-form label { font-size:12px; color:var(--muted); }
  .agent-form input, .agent-form select, .agent-form textarea { width:100%; }
  .agent-form textarea { resize:vertical; min-height:52px; }

  button.chat-toggle-btn { background:transparent; border-color:var(--border); color:var(--text);
    font-weight:600; padding:5px 9px; font-size:13px; }
  button.chat-toggle-btn:hover:not(:disabled) { background:var(--panel2); }
  button.chat-toggle-btn.active { border-color:var(--accent); color:var(--accent); }
  .agent-chat-panel { margin-top:10px; padding-top:10px; border-top:1px dashed var(--border-soft); }
  .agent-chat-log { display:flex; flex-direction:column; gap:8px; max-height:220px;
    overflow-y:auto; padding-right:2px; margin-bottom:8px; }
  .agent-chat-msg { padding:8px 11px; border-radius:var(--radius-sm); font-size:13px;
    max-width:88%; white-space:pre-wrap; word-wrap:break-word; }
  .agent-chat-msg.user { align-self:flex-end; color:#0b0d16; font-weight:500;
    background:linear-gradient(155deg, var(--accent), #9aa5fb); }
  .agent-chat-msg.assistant { align-self:flex-start; background:var(--panel2); border:1px solid var(--border-soft); }
  .agent-chat-composer { display:flex; gap:8px; align-items:flex-end; }
  .agent-chat-composer textarea { flex:1; resize:vertical; min-height:38px; max-height:120px; }

  .integ-item { padding:9px 0; border-bottom:1px solid var(--border-soft); }
  .integ-item:last-child { border-bottom:none; }
  .integ-row { display:flex; align-items:center; gap:10px; }
  .integ-row .info { flex:1; min-width:0; }
  .integ-row .provider { font-weight:600; font-size:13.5px; text-transform:capitalize; }
  .integ-row .status { font-size:12px; }
  .integ-row .status.connected { color:var(--ok); }
  .integ-row .status.disconnected { color:var(--muted); }
  .integ-actions { display:flex; gap:6px; flex-shrink:0; }
  .integ-extra { margin-top:6px; }
  .integ-extra a { text-decoration:none; font-weight:600; }
  .integ-form { margin-top:14px; padding-top:14px; border-top:1px solid var(--border-soft);
    display:flex; flex-direction:column; gap:9px; }
  .integ-form label { font-size:12px; color:var(--muted); }
  .integ-form select { width:100%; }

  .usage-plan { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .usage-plan .plan-name { font-size:17px; font-weight:700; font-family:"Space Grotesk", sans-serif; }
  .usage-plan .price { color:var(--muted); font-size:12.5px; }
  .progress { background:var(--panel2); border:1px solid var(--border); border-radius:999px;
    height:8px; overflow:hidden; margin:12px 0 6px; }
  .progress-fill { height:100%; background:linear-gradient(90deg, var(--accent), var(--signal)); transition:width .4s var(--ease-out); }
  .usage-nums { font-size:12.5px; color:var(--muted); display:flex; justify-content:space-between; font-variant-numeric:tabular-nums; }
  .status-line { margin-top:14px; padding-top:12px; border-top:1px solid var(--border-soft);
    font-size:13px; display:flex; flex-direction:column; gap:4px; }
  .status-ok { color:var(--ok); }
  .status-warn { color:var(--danger); font-weight:600; }

  .hist-row { display:flex; justify-content:space-between; gap:10px; padding:9px 0;
    border-bottom:1px solid var(--border-soft); font-size:13px; }
  .hist-row:last-child { border-bottom:none; }
  .hist-row .type { font-weight:600; }
  .hist-row .date { color:var(--muted); font-size:11.5px; }
  .hist-row .amount { color:var(--muted); white-space:nowrap; }

  @media (prefers-reduced-motion: reduce) {
    .widget { animation:none; }
    button, select, input, textarea, .progress-fill { transition:none; }
  }
</style>
</head>
<body>
<header>
  <div class="brandmark"></div>
  <h1 class="brand-font">KI-Plattform · Dashboard</h1>
  <div class="spacer"></div>
  <a class="navlink" href="/index.html">← Chat</a>
  <button class="ghost" id="logout" title="API-Key vergessen">⎋</button>
</header>

<main>
  <div class="setup" id="setup">
    <label for="key">API-Schlüssel (aus <code>/admin/provision</code>)</label>
    <div class="row">
      <input id="key" type="password" placeholder="pk_…" style="flex:1;min-width:220px" />
      <button id="connect">Verbinden</button>
    </div>
    <p class="hint">Der Schlüssel bleibt nur lokal im Browser (localStorage).</p>
    <div class="err" id="setupErr"></div>
  </div>

  <div id="board" style="display:none">
    <p class="hint" style="margin:0 0 14px">Widgets per Ziehen an der Kopfzeile neu anordnen — die Reihenfolge wird gespeichert.</p>
    <div class="grid" id="grid"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let KEY = localStorage.getItem("pk") || "";

function authHeader() { return { "Authorization": "Bearer " + KEY, "Content-Type": "application/json" }; }

async function apiGet(path) {
  const r = await fetch(path, { headers: authHeader() });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ("HTTP " + r.status));
  return data;
}

async function apiSend(path, method, body) {
  const r = await fetch(path, { method, headers: authHeader(), body: body ? JSON.stringify(body) : undefined });
  if (r.status === 204) return null;
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ("HTTP " + r.status));
  return data;
}

/* ---------------------------------------------------------------------
   Widget-Registry: jedes Widget hat eine id, einen Titel und eine
   render(bodyEl)-Funktion, die Inhalt+Fehlerbehandlung selbst uebernimmt.
--------------------------------------------------------------------- */
const WIDGETS = {
  agents: { title: "Agenten", render: renderAgentsWidget },
  usage:  { title: "Verbrauch", render: renderUsageWidget },
  billing:{ title: "Abrechnungshistorie", render: renderBillingWidget },
  integrations: { title: "Integrationen", render: renderIntegrationsWidget },
};
const DEFAULT_ORDER = ["agents", "usage", "billing", "integrations"];
const LAYOUT_KEY = "dashboard_layout";

function loadLayout() {
  try {
    const saved = JSON.parse(localStorage.getItem(LAYOUT_KEY) || "null");
    if (Array.isArray(saved) && saved.length) {
      const known = saved.filter((id) => WIDGETS[id]);
      const missing = DEFAULT_ORDER.filter((id) => !known.includes(id));
      return [...known, ...missing];
    }
  } catch {}
  return [...DEFAULT_ORDER];
}

function saveLayout() {
  const order = [...$("grid").children].map((el) => el.dataset.widgetId);
  localStorage.setItem(LAYOUT_KEY, JSON.stringify(order));
}

function buildGrid() {
  const grid = $("grid");
  grid.innerHTML = "";
  for (const id of loadLayout()) {
    const w = WIDGETS[id];
    if (!w) continue;
    const el = document.createElement("div");
    el.className = "widget";
    el.dataset.widgetId = id;
    el.draggable = true;
    el.innerHTML = `
      <div class="widget-head">
        <span class="handle">⠿</span>
        <h2>${w.title}</h2>
        <span class="badge" data-role="badge"></span>
      </div>
      <div class="widget-body" data-role="body"><div class="loading">Lädt…</div></div>
    `;
    grid.appendChild(el);
    wireDrag(el);
    w.render(el.querySelector('[data-role="body"]'), el.querySelector('[data-role="badge"]'));
  }
}

/* ---- Drag & Drop (Vanilla HTML5, keine Bibliothek) ------------------- */
function wireDrag(el) {
  el.addEventListener("dragstart", () => {
    el.classList.add("dragging");
  });
  el.addEventListener("dragend", () => {
    el.classList.remove("dragging");
    [...$("grid").children].forEach((c) => c.classList.remove("drag-over"));
    saveLayout();
  });
  el.addEventListener("dragover", (e) => {
    e.preventDefault();
    const dragging = $("grid").querySelector(".dragging");
    if (!dragging || dragging === el) return;
    const rect = el.getBoundingClientRect();
    const before = (e.clientX - rect.left) < rect.width / 2;
    el.classList.add("drag-over");
    $("grid").insertBefore(dragging, before ? el : el.nextSibling);
  });
  el.addEventListener("dragleave", () => el.classList.remove("drag-over"));
  el.addEventListener("drop", (e) => {
    e.preventDefault();
    el.classList.remove("drag-over");
  });
}

/* ---------------------------------------------------------------------
   Widget: Agenten
--------------------------------------------------------------------- */
async function renderAgentsWidget(body, badge) {
  let models = [];
  let maxAgents = 0;
  // Chat-Zustand pro Agent (conversation_id + sichtbarer Verlauf) -- lebt in
  // dieser Closure, ueberlebt also einen erneuten draw() (z.B. nach dem
  // Loeschen eines anderen Agenten), aber nicht einen Seiten-Reload. Reicht
  // fuer "Gespraech fortsetzen", ohne ein eigenes Persistenz-UI zu bauen.
  const chatState = new Map(); // agent.id -> { conversationId, history, open }

  function getChatState(id) {
    if (!chatState.has(id)) chatState.set(id, { conversationId: null, history: [], open: false });
    return chatState.get(id);
  }

  function renderChatMessages(logEl, history) {
    logEl.innerHTML = "";
    for (const m of history) {
      const el = document.createElement("div");
      el.className = "agent-chat-msg " + m.role;
      // Anzeige-Fallback nur fuers Auge -- der leere String bleibt in
      // history (und geht so, wie in index.html send(), unveraendert an
      // den Server), damit keine erfundene Assistenz-Aussage im naechsten
      // Request landet.
      el.textContent = m.content || (m.role === "assistant" ? "(keine Antwort)" : "");
      logEl.appendChild(el);
    }
    logEl.scrollTop = logEl.scrollHeight;
  }

  // Chat-Panel eines einzelnen Agenten: SSE-Parsing exakt nach dem Muster
  // aus static/index.html send() -- data:-Zeilen parsen, choices[0].delta.content
  // fuer Text-Chunks, ein optionales {"conversation_id": "..."} vorab lesen und
  // fuer die naechste Nachricht an denselben Agenten mitschicken.
  function buildChatPanel(agent) {
    const st = getChatState(agent.id);
    const panel = document.createElement("div");
    panel.className = "agent-chat-panel";
    panel.style.display = st.open ? "block" : "none";
    panel.innerHTML = `
      <div class="agent-chat-log" data-role="chatLog"></div>
      <div class="agent-chat-composer">
        <textarea data-role="chatInput" placeholder="Nachricht an ${escapeHtml(agent.name)}… (Enter sendet, Shift+Enter = Zeile)" rows="1"></textarea>
        <button type="button" data-role="chatSend">Senden</button>
      </div>
      <div class="err" data-role="chatErr"></div>
    `;
    const logEl = panel.querySelector('[data-role="chatLog"]');
    const inputEl = panel.querySelector('[data-role="chatInput"]');
    const sendBtn = panel.querySelector('[data-role="chatSend"]');
    const errEl = panel.querySelector('[data-role="chatErr"]');
    renderChatMessages(logEl, st.history);

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      errEl.textContent = "";
      inputEl.value = "";
      sendBtn.disabled = true;
      st.history.push({ role: "user", content: text });
      renderChatMessages(logEl, st.history);

      let assistantIdx = -1;
      let full = "";

      // `retry` faengt wie in index.html genau EINEN Fall ab: eine lokal
      // gemerkte conversation_id, die der Server nicht mehr kennt (404).
      async function attempt(retry) {
        const r = await fetch(`/v1/agents/${encodeURIComponent(agent.id)}/chat`, {
          method: "POST", headers: authHeader(),
          body: JSON.stringify({ messages: st.history, conversation_id: st.conversationId, stream: true }),
        });
        if (!r.ok) {
          const data = await r.json().catch(() => ({}));
          if (r.status === 404 && retry) {
            st.conversationId = null;
            return attempt(false);
          }
          throw new Error(data.detail || ("HTTP " + r.status));
        }

        const reader = r.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split("\n");
          buf = lines.pop();
          for (const line of lines) {
            if (!line.startsWith("data:")) continue;
            const chunk = line.slice(5).trim();
            if (chunk === "[DONE]") continue;
            let obj;
            try { obj = JSON.parse(chunk); } catch { continue; }
            if (obj.conversation_id) { st.conversationId = obj.conversation_id; }
            const piece = obj.choices?.[0]?.delta?.content;
            if (piece) {
              if (assistantIdx === -1) {
                st.history.push({ role: "assistant", content: "" });
                assistantIdx = st.history.length - 1;
              }
              full += piece;
              st.history[assistantIdx].content = full;
              renderChatMessages(logEl, st.history);
            }
          }
        }
      }

      try {
        await attempt(true);
        if (assistantIdx === -1) {
          // Kein delta.content-Chunk kam an (z.B. Gateway nicht erreichbar,
          // Stream endete nach dem conversation_id-Chunk) -- `full` bleibt
          // bewusst der rohe (leere) Wert, nicht ein erfundener Text; die
          // Anzeige uebernimmt renderChatMessages() mit ihrem Fallback.
          st.history.push({ role: "assistant", content: full });
          renderChatMessages(logEl, st.history);
        }
      } catch (e) {
        errEl.textContent = "Fehler: " + e.message;
        // Keine leere Assistenz-Blase stehen lassen, wenn der Stream fehlschlug.
        if (assistantIdx !== -1 && !st.history[assistantIdx].content) {
          st.history.splice(assistantIdx, 1);
          renderChatMessages(logEl, st.history);
        }
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.onclick = sendMessage;
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    return panel;
  }

  async function load() {
    body.innerHTML = '<div class="loading">Lädt…</div>';
    try {
      const [agentsData, modelsData] = await Promise.all([
        apiGet("/v1/agents"),
        apiGet("/v1/models"),
      ]);
      models = modelsData.models || [];
      maxAgents = agentsData.max_agents;
      badge.textContent = `${agentsData.count}/${agentsData.max_agents}`;
      draw(agentsData.agents || []);
    } catch (e) {
      body.innerHTML = `<div class="err">Fehler beim Laden: ${escapeHtml(e.message)}</div>`;
    }
  }

  function draw(agents) {
    const list = document.createElement("div");
    if (!agents.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Noch keine Agenten angelegt.";
      list.appendChild(empty);
    } else {
      for (const a of agents) {
        const item = document.createElement("div");
        item.className = "agent-item";

        const row = document.createElement("div");
        row.className = "agent-row";
        row.innerHTML = `
          <div class="info">
            <div class="name"></div>
            <div class="model"></div>
          </div>
        `;
        row.querySelector(".name").textContent = a.name;
        row.querySelector(".model").textContent = a.model;

        const chatSt = getChatState(a.id);
        const chatBtn = document.createElement("button");
        chatBtn.type = "button";
        chatBtn.className = "chat-toggle-btn" + (chatSt.open ? " active" : "");
        chatBtn.textContent = "Chat";
        chatBtn.title = "Mit diesem Agenten chatten";
        row.appendChild(chatBtn);

        const del = document.createElement("button");
        del.className = "danger-btn";
        del.textContent = "Löschen";
        del.title = "Agent löschen";
        let armed = false;
        let armTimer = null;
        del.onclick = async () => {
          if (!armed) {
            armed = true;
            del.classList.add("confirm");
            del.textContent = "Sicher?";
            armTimer = setTimeout(() => {
              armed = false;
              del.classList.remove("confirm");
              del.textContent = "Löschen";
            }, 3000);
            return;
          }
          clearTimeout(armTimer);
          del.disabled = true;
          try {
            await apiSend(`/v1/agents/${encodeURIComponent(a.id)}`, "DELETE");
            chatState.delete(a.id);
            await load();
          } catch (e) {
            body.querySelector('[data-role="agentErr"]').textContent = "Löschen fehlgeschlagen: " + e.message;
            del.disabled = false;
            del.classList.remove("confirm");
            del.textContent = "Löschen";
            armed = false;
          }
        };
        row.appendChild(del);
        item.appendChild(row);

        const chatPanel = buildChatPanel(a);
        item.appendChild(chatPanel);
        chatBtn.onclick = () => {
          chatSt.open = !chatSt.open;
          chatPanel.style.display = chatSt.open ? "block" : "none";
          chatBtn.classList.toggle("active", chatSt.open);
          if (chatSt.open) chatPanel.querySelector('[data-role="chatInput"]').focus();
        };

        list.appendChild(item);
      }
    }

    const form = document.createElement("form");
    form.className = "agent-form";
    const modelOptions = models.map((m) => `<option value="${escapeHtml(m.id)}">${escapeHtml(m.label)}</option>`).join("");
    // Vorlagen fuellen Name/System-Prompt vor -- der Agent selbst entsteht
    // genau wie jeder manuell angelegte, ueber denselben POST /v1/agents.
    // Keine neue Backend-Funktion noetig, nur ein schnellerer Start.
    const PRESETS = {
      "": { name: "", prompt: "" },
      coding: {
        name: "Coding-Assistent",
        prompt: "Du bist ein präziser Programmier-Assistent. Erkläre Code klar, " +
          "schlage konkrete, lauffähige Verbesserungen vor, und weise auf Bugs " +
          "oder Sicherheitsprobleme hin, wenn du welche siehst. Bei Unsicherheit " +
          "sag das offen, statt zu raten."
      },
      writing: {
        name: "Text-Assistent",
        prompt: "Du hilfst beim Formulieren und Überarbeiten von Texten (E-Mails, " +
          "Beschreibungen, Dokumentation). Klar, knapp, ohne Floskeln."
      },
      support: {
        name: "Kundensupport-Assistent",
        prompt: "Du beantwortest Kundenfragen freundlich und präzise. Bei Unsicherheit " +
          "sag ehrlich, dass du es nicht weißt, statt etwas zu erfinden."
      },
    };
    form.innerHTML = `
      <label for="agPreset">Vorlage (optional)</label>
      <select id="agPreset">
        <option value="">— Leer, selbst schreiben —</option>
        <option value="coding">Coding-Assistent</option>
        <option value="writing">Text-Assistent</option>
        <option value="support">Kundensupport-Assistent</option>
      </select>
      <label for="agName">Neuer Agent</label>
      <input id="agName" type="text" placeholder="Name" required maxlength="120" />
      <select id="agModel" ${models.length ? "" : "disabled"}>
        ${models.length ? modelOptions : '<option value="">Keine Modelle verfügbar</option>'}
      </select>
      <textarea id="agPrompt" placeholder="System-Prompt (optional)" maxlength="20000"></textarea>
      <div class="row">
        <button type="submit" ${models.length ? "" : "disabled"}>Anlegen</button>
        <span class="hint" style="flex:1">${maxAgents ? "Tarif-Limit: " + maxAgents + " Agenten" : ""}</span>
      </div>
      <div class="err" data-role="agentErr"></div>
    `;
    form.querySelector("#agPreset").onchange = (e) => {
      const p = PRESETS[e.target.value] || PRESETS[""];
      form.querySelector("#agName").value = p.name;
      form.querySelector("#agPrompt").value = p.prompt;
    };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const errEl = form.querySelector('[data-role="agentErr"]');
      errEl.textContent = "";
      const name = form.querySelector("#agName").value.trim();
      const model = form.querySelector("#agModel").value;
      const system_prompt = form.querySelector("#agPrompt").value.trim();
      if (!name || !model) { errEl.textContent = "Name und Modell sind erforderlich."; return; }
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        await apiSend("/v1/agents", "POST", { name, model, system_prompt });
        await load();
      } catch (e) {
        errEl.textContent = e.message;
        btn.disabled = false;
      }
    };
    list.appendChild(form);

    body.innerHTML = "";
    body.appendChild(list);
  }

  await load();
}

/* ---------------------------------------------------------------------
   Widget: Verbrauch
--------------------------------------------------------------------- */
async function renderUsageWidget(body, badge) {
  try {
    const b = await apiGet("/v1/billing");
    badge.textContent = b.plan;
    const pct = Math.max(0, Math.min(100, b.usage.percent));
    const warn = b.account_status !== "active" || (b.subscription_status && b.subscription_status !== "active");
    const barColor = pct >= 90 ? "var(--danger)" : (pct >= 70 ? "var(--warn)" : "var(--accent)");
    const periodEnd = b.current_period_end ? new Date(b.current_period_end).toLocaleDateString("de-CH") : "—";
    body.innerHTML = `
      <div class="usage-plan">
        <span class="plan-name"></span>
        <span class="price"></span>
      </div>
      <div class="progress"><div class="progress-fill" style="width:${pct}%;background:${barColor}"></div></div>
      <div class="usage-nums">
        <span></span>
        <span>${pct}%</span>
      </div>
      <div class="status-line">
        <span class="${warn ? "status-warn" : "status-ok"}"></span>
        <span class="hint">Abrechnungsperiode endet: ${periodEnd}</span>
      </div>
    `;
    body.querySelector(".plan-name").textContent = b.plan;
    body.querySelector(".price").textContent = `${b.price_chf} ${b.currency} · ${b.vat_note}`;
    body.querySelector(".usage-nums span").textContent = `${b.usage.tokens_total} / ${b.usage.limit} Tokens`;
    body.querySelector(".status-line span").textContent =
      `Konto: ${b.account_status} · Abo: ${b.subscription_status || "—"}`;
  } catch (e) {
    body.innerHTML = `<div class="err">Fehler beim Laden: ${escapeHtml(e.message)}</div>`;
  }
}

/* ---------------------------------------------------------------------
   Widget: Abrechnungshistorie
--------------------------------------------------------------------- */
const HIST_LABELS = {
  subscription_started: "Abo gestartet",
  plan_changed: "Tarif geändert",
  subscription_cancelled: "Abo gekündigt",
  invoice_paid: "Zahlung erhalten",
  payment_failed: "Zahlung fehlgeschlagen",
};

async function renderBillingWidget(body, badge) {
  try {
    const b = await apiGet("/v1/billing");
    const history = b.history || [];
    badge.textContent = history.length ? `${history.length} Einträge` : "";
    if (!history.length) {
      body.innerHTML = '<div class="empty">Keine Buchungen vorhanden.</div>';
      return;
    }
    const list = document.createElement("div");
    for (const h of history) {
      const row = document.createElement("div");
      row.className = "hist-row";
      const date = new Date(h.occurred_at).toLocaleString("de-CH");
      row.innerHTML = `
        <span>
          <span class="type"></span><br/>
          <span class="date"></span>
        </span>
        <span class="amount"></span>
      `;
      row.querySelector(".type").textContent = HIST_LABELS[h.type] || h.type;
      row.querySelector(".date").textContent = date + (h.plan ? " · " + h.plan : "");
      row.querySelector(".amount").textContent = h.amount_chf != null ? `${h.amount_chf} CHF` : "—";
      list.appendChild(row);
    }
    body.innerHTML = "";
    body.appendChild(list);
  } catch (e) {
    body.innerHTML = `<div class="err">Fehler beim Laden: ${escapeHtml(e.message)}</div>`;
  }
}

/* ---------------------------------------------------------------------
   Widget: Integrationen
   Provider-Liste aus app/routes/integrations.py (KNOWN_PROVIDERS) -- nicht
   erfinden, nur uebernehmen. Ohne COMPOSIO_API_KEY liefert das Backend beim
   Anlegen kein connect_url und status bleibt 'disconnected' -- das ist der
   dokumentierte Normalfall (siehe composio_client.py), keine Fehlermeldung.
--------------------------------------------------------------------- */
async function renderIntegrationsWidget(body, badge) {
  const PROVIDERS = ["slack", "notion", "google"];
  // connect_url kommt nur in der Antwort von POST /v1/integrations zurueck,
  // nicht aus GET /v1/integrations -- deshalb hier fuer die Dauer der
  // Sitzung gemerkt, damit der Login-Link nach dem Anlegen sichtbar bleibt.
  const pendingConnectUrls = new Map(); // integration.id -> connect_url

  async function load() {
    body.innerHTML = '<div class="loading">Lädt…</div>';
    try {
      const data = await apiGet("/v1/integrations");
      badge.textContent = String(data.count);
      draw(data.integrations || []);
    } catch (e) {
      body.innerHTML = `<div class="err">Fehler beim Laden: ${escapeHtml(e.message)}</div>`;
    }
  }

  function statusLabel(status) {
    return status === "connected" ? "Verbunden" : "Nicht verbunden";
  }

  function draw(integrations) {
    const list = document.createElement("div");
    if (!integrations.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Noch keine Integrationen angelegt.";
      list.appendChild(empty);
    } else {
      for (const it of integrations) {
        const item = document.createElement("div");
        item.className = "integ-item";

        const row = document.createElement("div");
        row.className = "integ-row";
        row.innerHTML = `
          <div class="info">
            <div class="provider"></div>
            <div class="status"></div>
          </div>
        `;
        row.querySelector(".provider").textContent = it.provider;
        const statusEl = row.querySelector(".status");
        statusEl.className = "status " + (it.status === "connected" ? "connected" : "disconnected");
        statusEl.textContent = statusLabel(it.status);

        const actions = document.createElement("div");
        actions.className = "integ-actions";

        const refreshBtn = document.createElement("button");
        refreshBtn.type = "button";
        refreshBtn.className = "chat-toggle-btn";
        refreshBtn.textContent = "Aktualisieren";
        refreshBtn.title = "Verbindungsstatus bei Composio neu abfragen";

        const del = document.createElement("button");
        del.className = "danger-btn";
        del.textContent = "Löschen";
        del.title = "Integration löschen";
        let armed = false;
        let armTimer = null;
        del.onclick = async () => {
          if (!armed) {
            armed = true;
            del.classList.add("confirm");
            del.textContent = "Sicher?";
            armTimer = setTimeout(() => {
              armed = false;
              del.classList.remove("confirm");
              del.textContent = "Löschen";
            }, 3000);
            return;
          }
          clearTimeout(armTimer);
          del.disabled = true;
          try {
            await apiSend(`/v1/integrations/${encodeURIComponent(it.id)}`, "DELETE");
            pendingConnectUrls.delete(it.id);
            await load();
          } catch (e) {
            errEl.textContent = "Löschen fehlgeschlagen: " + e.message;
            del.disabled = false;
            del.classList.remove("confirm");
            del.textContent = "Löschen";
            armed = false;
          }
        };

        actions.appendChild(refreshBtn);
        actions.appendChild(del);
        row.appendChild(actions);
        item.appendChild(row);

        const extra = document.createElement("div");
        extra.className = "integ-extra";
        const errEl = document.createElement("div");
        errEl.className = "err";
        item.appendChild(extra);
        item.appendChild(errEl);

        function renderExtra() {
          extra.innerHTML = "";
          const url = pendingConnectUrls.get(it.id);
          if (url) {
            const a = document.createElement("a");
            a.href = url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.style.color = "var(--accent)";
            a.style.fontSize = "13px";
            a.textContent = "→ Composio-Login abschliessen";
            extra.appendChild(a);
          } else if (it.status !== "connected") {
            const hint = document.createElement("span");
            hint.className = "hint";
            hint.textContent = "Kein Login-Link hinterlegt (COMPOSIO_API_KEY nicht " +
              "konfiguriert oder Login bereits erledigt) — mit „Aktualisieren“ " +
              "Status neu prüfen.";
            extra.appendChild(hint);
          }
        }
        renderExtra();

        refreshBtn.onclick = async () => {
          errEl.textContent = "";
          refreshBtn.disabled = true;
          try {
            const updated = await apiSend(`/v1/integrations/${encodeURIComponent(it.id)}/refresh`, "POST");
            it.status = updated.status;
            statusEl.className = "status " + (it.status === "connected" ? "connected" : "disconnected");
            statusEl.textContent = statusLabel(it.status);
            if (it.status === "connected") pendingConnectUrls.delete(it.id);
            renderExtra();
          } catch (e) {
            errEl.textContent = e.message;
          } finally {
            refreshBtn.disabled = false;
          }
        };

        list.appendChild(item);
      }
    }

    const form = document.createElement("form");
    form.className = "integ-form";
    form.innerHTML = `
      <label for="intProvider">Neue Integration</label>
      <select id="intProvider">
        ${PROVIDERS.map((p) => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join("")}
      </select>
      <div class="row">
        <button type="submit">Anlegen</button>
      </div>
      <div class="err" data-role="intErr"></div>
    `;
    form.onsubmit = async (e) => {
      e.preventDefault();
      const errEl2 = form.querySelector('[data-role="intErr"]');
      errEl2.textContent = "";
      const provider = form.querySelector("#intProvider").value;
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = true;
      try {
        const created = await apiSend("/v1/integrations", "POST", { provider });
        if (created.connect_url) pendingConnectUrls.set(created.id, created.connect_url);
        await load();
      } catch (e) {
        errEl2.textContent = e.message;
        btn.disabled = false;
      }
    };
    list.appendChild(form);

    body.innerHTML = "";
    body.appendChild(list);
  }

  await load();
}

/* ---- Hilfsfunktionen -------------------------------------------------- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---- Auth / Bootstrap -------------------------------------------------- */
async function connect() {
  $("setupErr").textContent = "";
  KEY = $("key").value.trim();
  if (!KEY) { $("setupErr").textContent = "Bitte einen Schlüssel eingeben."; return; }
  try {
    await apiGet("/v1/models");
    localStorage.setItem("pk", KEY);
    $("setup").style.display = "none";
    $("board").style.display = "block";
    buildGrid();
  } catch (e) {
    $("setupErr").textContent = "Verbindung fehlgeschlagen: " + e.message;
  }
}

$("connect").onclick = connect;
$("logout").onclick = () => { localStorage.removeItem("pk"); localStorage.removeItem(LAYOUT_KEY); location.reload(); };
$("key").addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });

if (KEY) { $("key").value = KEY; connect(); }
