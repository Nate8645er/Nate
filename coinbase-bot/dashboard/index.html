<style>
  /* Layout: fixed top command bar + single scroll column of labelled panels; cards only where a block is a distinct object. */
  :root {
    --bg: #0a0e17; --panel: #111826; --panel-2: #0e1420; --line: #1e2a3d;

    --good: #35e0a0; --warn: #ffcf5c; --crit: #ff5c7a; --unknown: #8aa0bd;

    --sans: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef2f8; --panel: #ffffff; --panel-2: #f4f7fb; --line: #d7e0ee;
      --fg: #0d1626; --muted: #4a5d78; --accent: #0bb49c; --accent-2: #2f6bff;
      --good: #0a9d6e; --warn: #9a6a00; --crit: #c8324f; --unknown: #4a5d78;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #eef2f8; --panel: #ffffff; --panel-2: #f4f7fb; --line: #d7e0ee;
    --fg: #0d1626; --muted: #4a5d78; --accent: #0bb49c; --accent-2: #2f6bff;
    --good: #0a9d6e; --warn: #9a6a00; --crit: #c8324f; --unknown: #4a5d78;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans);
    line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    background: #060910; z-index: 30; }
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px; max-width: 1180px; margin: 0 auto; }
  header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: linear-gradient(180deg, #0b1220f2, #0b1220d9); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px); }
  .bar .wrap { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; padding-block: 12px; }
  .logo { font-family: var(--mono); font-weight: 700; letter-spacing: .14em; font-size: 15px;
    color: var(--fg); text-transform: uppercase; }
  .logo b { color: var(--accent); }
  .mode { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; padding: 4px 10px;
    border-radius: 999px; border: 1px solid var(--line); color: var(--warn);
    background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .estop { margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--crit);
    color: var(--crit); background: color-mix(in srgb, var(--crit) 10%, transparent); }
  .asof { color: var(--muted); font-size: 11px; font-family: var(--mono); width: 100%; }
  h2 { font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
  h2::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--accent);
    box-shadow: 0 0 10px var(--accent); }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
  .card.k { display: flex; flex-direction: column; gap: 4px; }
  .k .label { font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .k .val { font-family: var(--mono); font-size: 22px; font-variant-numeric: tabular-nums; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .pill { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; padding: 3px 8px;
    border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
  .p-good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
  .p-warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .p-crit { color: var(--crit); background: color-mix(in srgb, var(--crit) 16%, transparent); }
  .p-unknown { color: var(--unknown); background: color-mix(in srgb, var(--unknown) 14%, transparent); }
  .p-info { color: var(--accent-2); background: color-mix(in srgb, var(--accent-2) 14%, transparent); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); position: sticky; top: 0; background: var(--panel-2); }
  td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .agent { display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  footer { margin: 34px 0 10px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--line); padding-top: 14px; }
</style>

const BLOCK = [/nigg|n1gg/i, /fa?gg/i, /\bk[iy]ke\b/i]; // mask slurs in on-chain names
function clean(name){
  let n = String(name||"");
  if (BLOCK.some(re => re.test(n))) {
    n = n.replace(/[A-Za-z0-9$]+/g, w => BLOCK.some(re=>re.test(w)) ? (w[0]+"•••") : w);
  }
  return n || "—";
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtUsd = v => v==null ? "—" : (v>=1 ? "$"+v.toLocaleString(undefined,{maximumFractionDigits:2}) : "$"+Number(v).toPrecision(3));
const riskClass = r => ({CRITICAL:"p-crit",HIGH:"p-crit",CAUTION:"p-warn",UNKNOWN:"p-unknown",SAFE:"p-good"}[r]||"p-unknown");

    <div class="card k"><span class="label">Kapitalgrenze</span><span class="val">$${c.capital_ceiling_usdc.toFixed(2)}</span><span class="muted" style="font-size:12px">absolut, nie erhöht</span></div>
    <div class="card k"><span class="label">live_allowed</span><span class="val" style="color:var(--crit)">${c.live_allowed}</span><span class="muted" style="font-size:12px">Not-Aus bereit</span></div>
    <div class="card k"><span class="label">Agenten</span><span class="val">${c.agents.length}/6</span><span class="muted" style="font-size:12px">aktiv</span></div>
  </div>`;
}
function sectionAgents(){
  const rows = DATA.agents.map(a => `<div class="row"><span class="agent"><span class="dot"></span>${esc(a.name)}</span><span class="pill p-info">${esc(a.status)}</span></div>`).join("");
  return `<h2>2 · AI Trading Team</h2><div class="card">${rows}
    <div class="note">Gemeinsamer Debattenraum: Stimmen (Trend, Momentum, Mean-Reversion, Vol-Skeptiker) bewerten dieselben Daten und dürfen widersprechen. RiskManager hat ein verbindliches Veto; jeder Agent darf NO TRADE empfehlen.</div></div>`;
}
function sectionMarket(){
  const cards = DATA.market.map(m => `<div class="card k"><span class="label">${esc(m.symbol)}</span><span class="val">${fmtUsd(m.mid)}</span><span class="muted" style="font-size:12px">Coinbase, live</span></div>`).join("") || `<div class="card muted">Keine Marktdaten abrufbar.</div>`;
  return `<h2>3 · Live Market</h2><div class="grid">${cards}</div>
    <div class="note">Spot-Referenz von Coinbase (öffentliche Candles). Memecoins/neue Listings siehe Scanner.</div>`;
}
function sectionScanner(){

    <tr>
      <td>${esc(clean(t.name))}</td>
      <td><span class="pill p-unknown">${esc(t.category)}</span></td>
      <td class="num">${t.mc_or_fdv==null?"—":fmtUsd(t.mc_or_fdv)}${t.uncertain?' <span class="muted">?</span>':''}</td>
      <td class="num">${t.liquidity_usd==null?"—":fmtUsd(t.liquidity_usd)}</td>
      <td class="num">${t.volume_24h==null?"—":fmtUsd(t.volume_24h)}</td>
      <td><span class="pill ${riskClass(t.risk)}">${esc(t.risk)}</span></td>
      <td>${t.veto?'<span class="pill p-crit">VETO</span>':'<span class="pill p-good">ok</span>'}</td>
      <td>${t.enriched?'<span class="pill p-info">on-chain</span>':'<span class="muted">—</span>'}</td>
    </tr>`).join("");
  return `<h2>4 · Memecoin Scanner</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Token</th><th>Kategorie</th><th>MC/FDV</th><th>Liquidität</th><th>Vol 24h</th><th>Risiko</th><th>RiskMgr</th><th>Daten</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="note">MC/FDV mit „?“ = Supply unbekannt, Bewertung unsicher. Niedrige Market Cap ist kein Kaufsignal. Namen mit Schimpfwörtern sind maskiert; Daten sind echt (GeckoTerminal + Solana-RPC).</div>`;
}
function sectionPortfolios(){
  const rows = DATA.portfolios.map(p => {
    const bt = p.backtest ? `${p.backtest.trades} Trades · Win ${p.backtest.win_rate_pct}% · PF ${p.backtest.profit_factor} · ${p.backtest.net_pnl_pct}% · DD ${p.backtest.max_dd_pct}%` : "—";
    return `<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.market)}</td><td class="num">$${p.cash_usd.toFixed(2)}</td><td>${esc(p.decision)}</td><td class="muted">${bt}</td></tr>`;
  }).join("");
  return `<h2>5 · Portfolios (A–E, virtuell)</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>#</th><th>Markt</th><th>Paper-Cash</th><th>Entscheidung</th><th>Backtest (Referenz)</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="note">Alle Portfolios sind virtuell. Backtest-Zahlen sind simuliert und keine Live-Ergebnisse.</div>`;
}
function sectionJournal(){
  const items = DATA.portfolios.map(p => `<div class="row"><span>Portfolio ${esc(p.name)} · ${esc(p.market)}</span><span class="pill p-info">${esc(String(p.decision).slice(0,42))}</span></div>`).join("");
  return `<h2>6 · Trading Journal</h2><div class="card">${items}
    <div class="note">Jede Entscheidung ist nachvollziehbar (Datenquelle, Risiko-Gate, RiskManager). In diesem Snapshot wurde keine Order ausgeführt — Paper.</div></div>`;
}
function sectionRisk(){
  const rows = DATA.risk_events.map(r => `<div class="row"><span>${esc(clean(r.token))}</span><span><span class="pill ${riskClass(r.level)}">${esc(r.level)}</span> <span class="muted mono">${esc(r.flags.join(", "))}</span></span></div>`).join("") || `<div class="muted">Keine Risiko-Vetos.</div>`;
  return `<h2>7 · Risk Center</h2><div class="card">
    <div class="row"><span>Vetos aktiv</span><span class="pill p-crit">${DATA.risk_events.length}</span></div>
    ${rows}
    <div class="note">Kritische Flags (fehlende Exit-Liquidität, Honeypot, aktive Mint/Freeze-Authority) lösen ein verbindliches Veto aus. Fehlende Daten → UNKNOWN, nie SAFE.</div></div>`;
}
function sectionConnectors(){
  const rows = DATA.connectors.map(c => {
    const cls = c.status==="CONNECTED" ? "p-good" : (c.status==="ERROR" ? "p-crit" : "p-warn");
    return `<div class="row"><span>${esc(c.name)}</span><span><span class="pill ${cls}">${esc(c.status)}</span> <span class="muted" style="font-size:11px">${esc(c.detail)}</span></span></div>`;
  }).join("");
  return `<h2>8 · Connectors</h2><div class="card">${rows}
    <div class="note">Live-Status echter, kostenloser Endpunkte. Phantom ist bewusst nicht verbunden (keine Keys, keine Signatur).</div></div>`;
}

document.getElementById("asof").textContent = "Snapshot: " + new Date(DATA.generated_at).toLocaleString() + " · echte Backend-Daten";
document.getElementById("app").innerHTML =
  sectionCommand() + sectionAgents() + sectionMarket() + sectionScanner() +
  sectionPortfolios() + sectionJournal() + sectionRisk() + sectionConnectors() +
  `<footer>HyperGrok Control Center · reiner Paper-/Read-only-Modus · kein Echtgeld-Handel, keine Transfers, kein Hebel, keine Keys gespeichert. Daten sind ein Snapshot zum angezeigten Zeitpunkt, kein Live-Stream.</footer>`;
</script>
