      <stop offset="0" stop-color="#12151d"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e7ebf3; }
