<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151d"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #e7ebf3; }
      .brand { font-size: 35px; fill: #8b93a7; letter-spacing: 3px; }
