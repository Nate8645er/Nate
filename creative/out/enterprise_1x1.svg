      .price { font-size: 63px; font-weight: 700; fill: #6c8cff; }
      .aud   { font-size: 37px; fill: #8b93a7; }
      .feat  { font-size: 39px; }
      .foot  { font-size: 28px; fill: #8b93a7; }
    </style>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="15" fill="#6c8cff"/>
