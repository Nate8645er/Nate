    <circle cx="96" cy="628" r="7" fill="#6c8cff"/><text x="120" y="640" class="feat">Unbegrenzte Agenten</text>
    <circle cx="96" cy="706" r="7" fill="#6c8cff"/><text x="120" y="718" class="feat">SLA + Onboarding</text>
    <circle cx="96" cy="784" r="7" fill="#6c8cff"/><text x="120" y="796" class="feat">Eigener Mandant</text>
